[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-api"
version = "0.2.0"
description = "Typed sync/async client for Arena Gradio and Direct Chat streams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx[http2]>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["arena_api*"]
