[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-api"
version = "0.2.0"
description = "Typed sync/async client for Arena Gradio and Direct Chat streams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx[http2]>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]
firefox = ["rookiepy>=0.5"]
# Human-in-the-loop session capture (arena_api.auth.verify). Upstream
# Playwright only: no stealth forks, no fingerprint patches.
browser = ["playwright>=1.44"]

[tool.setuptools.packages.find]
include = ["arena_api*"]
